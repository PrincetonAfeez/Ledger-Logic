[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlogic"
version = "0.1.0"
description = "A CLI personal finance analytics engine."
requires-python = ">=3.10"
dependencies = ["typing_extensions>=4.12"]

[project.scripts]
ledgerlogic = "ledgerlogic.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools]
packages = ["ledgerlogic", "ledgerlogic.analysis"]

[tool.setuptools.package-dir]
ledgerlogic = "."
"ledgerlogic.analysis" = "analysis"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
# Flat package at repo root: list modules explicitly (see mypy "Duplicate module __main__" if using `files = "."` with __main__.py).
files = [
    "__init__.py",
    "analyzer.py",
    "budget.py",
    "categorizer.py",
    "change_maker.py",
    "cli.py",
    "investment.py",
    "parsing.py",
    "reconciler.py",
    "report_builder.py",
    "schemas.py",
    "storage.py",
    "textutil.py",
    "analysis/__init__.py",
    "analysis/csv_columns.py",
    "analysis/csv_load.py",
    "analysis/menu.py",
    "analysis/metrics.py",
    "analysis/mock_data.py",
    "analysis/output.py",
    "analysis/records.py",
]
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
